<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { width: 300px; margin: 0; font: 13px/1.45 system-ui, sans-serif; background: #f7f5f0; color: #1c1b18; }
      main { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
      h1 { font-size: 15px; margin: 0; display: flex; align-items: center; gap: 8px; }
      p { margin: 0; color: #6b665c; }
      button { font: inherit; padding: 8px 12px; border-radius: 8px; border: 1px solid #1c1b18; background: #1c1b18; color: #f7f5f0; cursor: pointer; }
      button.ghost { background: transparent; color: #1c1b18; border-color: #ddd8cc; }
      ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
      li { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px; border: 1px solid #e6e1d6; border-radius: 8px; background: #fff; }
      li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      label { display: flex; gap: 8px; align-items: center; color: #6b665c; }
      h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: #6b665c; margin: 4px 0 0; }
    </style>
  </head>
  <body>
    <main>
      <h1><img src="icon-128.png" width="20" height="20" alt="" /> Eyrie</h1>
      <p>Post-quantum wallet. Dapps find it through EIP-6963; approvals open your Eyrie wallet.</p>
      <button id="open">Open wallet</button>
      <h2>Connected sites</h2>
      <ul id="sites"></ul>
      <label><input type="checkbox" id="local" /> Use local wallet (localhost:5180)</label>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
